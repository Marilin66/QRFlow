name: qrflow_mobile
description: "QRFlow — Détection intelligente de QR codes affichés à l'écran (import de capture + scan direct via bulle flottante)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Détection / décodage QR (ML Kit sur Android, VisionKit sur iOS)
  mobile_scanner: ^7.4.0
  # Import d'images depuis la galerie
  image_picker: ^1.1.2
  # Historique local (SQLite)
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  # Paramètres locaux
  shared_preferences: ^2.3.2
  # Actions (ouvrir lien, téléphoner, SMS, e-mail, maps…)
  url_launcher: ^6.3.1
  # Partage
  share_plus: ^11.0.0
  # Ajout au calendrier
  add_2_calendar: ^3.1.1
  # État de l'application
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
